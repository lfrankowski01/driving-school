<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css">
    <title>Driving School</title>
</head>
<body>
    <section class="booking">
        <h2>Book Your Lesson</h2>

        <form id="bookingForm">
            <label for="name">Your Name:</label>
            <input type="text" id="name"/>
            <label for="date">Select Date:</label>
            <input type="date" id="date" />
            <div class="time-slots">
                <label for="slots">Select Time:</label>
                <div id="slots"></div>
            </div>
            <label for="lessonType">Lesson Type:</label>
            <select id="lessonType">
                <option value="" disabled selected>Choose Lesson</option>
                <option value="Manual">Manual</option>
                <option value="Automatic">Automatic</option>
            </select>

            <button type="submit">Confirm Booking</button>
        </form>

        <div id="summary" class="hidden">
            <h3>Booking Summary</h3>
            <p id="summaryText"></p>
        </div>

        <div class="bookings">
            <h3>All Bookings</h3>
            <ul id="bookingList"></ul>
            <button id="clearBookings">Clear All Bookings</button>
        </div>
 
    </section>

    <script src="script.js"></script>
</body>

</html>
